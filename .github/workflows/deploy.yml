name: Deploy DEV to 202.157.184.164

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
  workflow_dispatch:
    inputs:
      run_migrate:
        description: "Force run php artisan migrate --force"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GIT_REPO_URL: https://github.com/atsolusigit/semesta-be.git
      BRANCH: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^database/migrations/'; then
            echo "migrate=true"  >> "$GITHUB_OUTPUT"
          else
            echo "migrate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "Host ${SSH_HOST}\n  HostName ${SSH_HOST}\n  User ${SSH_USER}\n  Port ${SSH_PORT}\n  StrictHostKeyChecking no\n" > ~/.ssh/config
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Remote deploy (git hard reset to server)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RUN_MIGRATIONS: ${{ inputs.run_migrate == 'true' || steps.detect.outputs.migrate == 'true' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} "bash -lc '
            set -e
            REPO_DIR=/var/www/html/semesta-be

            if [ ! -d \"$REPO_DIR/.git\" ]; then
              mkdir -p \"$REPO_DIR\"
              git clone ${GIT_REPO_URL} \"$REPO_DIR\"
              cd \"$REPO_DIR\"
              git checkout ${BRANCH} || git checkout -b ${BRANCH} origin/${BRANCH}
            else
              cd \"$REPO_DIR\"
              git fetch --all
              git checkout ${BRANCH} || true
              git reset --hard origin/${BRANCH}
            fi

            # dependencies
            if ! command -v composer >/dev/null 2>&1; then
              echo Composer not found. Please install Composer on server.
              exit 1
            fi
            composer install --prefer-dist --no-interaction

            # env must exist
            [ -f .env ] || { echo .env missing; exit 1; }

            # clear caches
            php artisan optimize:clear || true

            # conditional migrate
            if [ \"${RUN_MIGRATIONS}\" = \"true\" ]; then
              echo \"Running php artisan migrate --force\"
              php artisan migrate --force
            else
              echo \"Skip migrate (no migration change detected)\"
            fi

            # marker files
            date --iso-8601=seconds > public/deploy_time.txt
            echo ${GITHUB_SHA} > public/deploy_sha.txt

            # restart via systemd (service sudah dibuat)
            sudo systemctl restart semesta-be
          '"
