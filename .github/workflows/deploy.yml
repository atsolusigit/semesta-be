name: Deploy DEV to 202.157.184.164

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
  workflow_dispatch:
    inputs:
      run_migrate:
        description: "Force run php artisan migrate --force"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GIT_REPO_URL: https://github.com/atsolusigit/semesta-be.git
      BRANCH: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: detect
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^database/migrations/'; then
            echo "migrate=true"  >> "$GITHUB_OUTPUT"
          else
            echo "migrate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load connection vars (Secrets → Vars → defaults)
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.SSH_HOST }}";   [ -z "${HOST}" ] && HOST="${{ vars.SSH_HOST }}"
          USER="${{ secrets.SSH_USER }}";   [ -z "${USER}" ] && USER="${{ vars.SSH_USER }}"
          PORT="${{ secrets.SSH_PORT }}";   [ -z "${PORT}" ] && PORT="${{ vars.SSH_PORT }}"
          [ -z "${HOST}" ] && { echo "Missing SSH_HOST"; exit 1; }
          [ -z "${USER}" ] && { echo "Missing SSH_USER"; exit 1; }
          [ -z "${PORT}" ] && PORT="22"
          case "${PORT}" in (*[!0-9]*|"") echo "Invalid SSH_PORT: '${PORT}'"; exit 1;; esac
          echo "SSH_HOST=${HOST}" >> "$GITHUB_ENV"
          echo "SSH_USER=${USER}" >> "$GITHUB_ENV"
          echo "SSH_PORT=${PORT}" >> "$GITHUB_ENV"

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host target
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      - name: Remote deploy (git hard reset + restart service)
        env:
          RUN_MIGRATIONS: ${{ inputs.run_migrate == 'true' || steps.detect.outputs.migrate == 'true' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh target "bash -lc '
            set -e
            REPO_DIR=/var/www/html/semesta-be
            if [ ! -d \"\$REPO_DIR/.git\" ]; then
              mkdir -p \"\$REPO_DIR\"
              git clone ${GIT_REPO_URL} \"\$REPO_DIR\"
              cd \"\$REPO_DIR\"
              git checkout ${BRANCH} || git checkout -b ${BRANCH} origin/${BRANCH}
            else
              cd \"\$REPO_DIR\"
              git fetch --all
              git checkout ${BRANCH} || true
              git reset --hard origin/${BRANCH}
            fi
            if ! command -v composer >/dev/null 2>&1; then
              echo Composer not found
              exit 1
            fi
            composer install --prefer-dist --no-interaction
            [ -f .env ] || { echo .env missing; exit 1; }
            php artisan optimize:clear || true
            if [ \"${RUN_MIGRATIONS}\" = \"true\" ]; then
              php artisan migrate --force
            fi
            date --iso-8601=seconds > public/deploy_time.txt
            echo ${GITHUB_SHA} > public/deploy_sha.txt
            sudo systemctl restart semesta-be || exit 1
          '"
