name: Deploy DEV to 202.157.184.164

on:
  push:
    branches: ["development"]
  pull_request:
    branches: ["development"]
  workflow_dispatch:
    inputs:
      run_migrate:
        description: "Force run php artisan migrate --force"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          # fallback kalau tidak ada before (mis. first push)
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          echo "Compare $BEFORE..${{ github.sha }}"
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^database/migrations/'; then
            echo "migrate=true"  >> "$GITHUB_OUTPUT"
          else
            echo "migrate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected migrate: $(cat $GITHUB_OUTPUT)"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "Host ${SSH_HOST}\n  HostName ${SSH_HOST}\n  User ${SSH_USER}\n  Port ${SSH_PORT}\n  StrictHostKeyChecking no\n" > ~/.ssh/config
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: Install rsync & ssh client
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Rsync source to server (exclude junk)
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "vendor" \
            --exclude "storage/logs/*.log" \
            --exclude "storage/framework/cache/data/*" \
            ./ ${SSH_USER}@${SSH_HOST}:/var/www/html/semesta-be/
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}

      - name: Remote deploy (with conditional migrate)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          RUN_MIGRATIONS: ${{ inputs.run_migrate == 'true' || steps.detect.outputs.migrate == 'true' }}
        run: |
          ssh -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST} 'bash -lc "
            set -e
            cd /var/www/html/semesta-be

            # dependencies
            composer install --prefer-dist --no-interaction

            # env must exist
            [ -f .env ] || { echo .env missing; exit 1; }

            # apply optimize clear
            php artisan optimize:clear || true

            # conditional migrate
            if [ \"${RUN_MIGRATIONS}\" = \"true\" ]; then
              echo \"Running php artisan migrate --force\"
              php artisan migrate --force
            else
              echo \"Skip migrate (no migration change detected)\"
            fi

            # restart dev server
            pkill -f \"artisan serve\" || true
            nohup php artisan serve --host=0.0.0.0 --port=8000 >/dev/null 2>&1 &
          "'
